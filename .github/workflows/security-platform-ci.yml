name: AegisLedger Ops - Security CI
on:
  push:
    paths:
      - 'security-platform/**'
      - '.github/workflows/security-platform-ci.yml'
  pull_request:
    paths:
      - 'security-platform/**'
      - '.github/workflows/security-platform-ci.yml'
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: security-platform/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app
      - name: Test
        run: python -m pytest -q
